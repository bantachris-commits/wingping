<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 380px; margin: 0; font: 13px/1.4 system-ui, sans-serif;
      background: #0b1220; color: #e5eaf3;
    }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-bottom: 1px solid #1f2a44;
    }
    header h1 { font-size: 14px; margin: 0; flex: 1; }
    header button {
      background: #1d4ed8; color: #fff; border: 0; border-radius: 6px;
      padding: 4px 10px; cursor: pointer; font-size: 12px;
    }
    header button.toggled { background: #166534; }
    header a { color: #93b4f8; font-size: 12px; text-decoration: none; }
    #meta { padding: 6px 12px; color: #8b96ad; font-size: 11px; }
    #meta .excl { color: #6b7a97; }
    #err { padding: 6px 12px; color: #fca5a5; font-size: 12px; }

    /* radar scope */
    #radarWrap { display: none; padding: 8px 12px 4px; }
    #radarWrap.open { display: block; }
    #radar { display: block; margin: 0 auto; cursor: crosshair; }
    #radarHint, #mapHint { text-align: center; color: #5b6b8c; font-size: 10px; margin: 4px 0 2px; }

    /* mini map */
    #mapWrap { display: none; padding: 8px 12px 4px; position: relative; }
    #mapWrap.open { display: block; }
    #miniMap { height: 320px; border-radius: 8px; border: 1px solid #223051; background: #0b1220; }
    #expandMap {
      position: absolute; top: 16px; right: 20px; z-index: 1000;
      background: rgba(11,18,32,.9); color: #e5eaf3; border: 1px solid #2a3450;
      border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 11px;
    }
    .leaflet-container { background: #0b1220; font: 11px system-ui; }

    ul { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow-y: auto; }
    li {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-bottom: 1px solid #131c31; cursor: pointer;
    }
    li:hover { background: #12203c; }
    .id { font-weight: 600; }
    .sub { color: #8b96ad; font-size: 11px; }
    .grow { flex: 1; min-width: 0; }
    .badge {
      font-size: 9px; font-weight: 700; letter-spacing: .04em;
      padding: 2px 5px; border-radius: 4px; white-space: nowrap;
    }
    .b-military { background: #7f1d1d; color: #fecaca; }
    .b-helicopter { background: #713f12; color: #fde68a; }
    .b-jet { background: #1e3a8a; color: #bfdbfe; }
    .b-heavy { background: #312e81; color: #c7d2fe; }
    .b-balloon { background: #581c87; color: #e9d5ff; }
    .b-glider { background: #134e4a; color: #99f6e4; }
    .b-drone { background: #831843; color: #fbcfe8; }
    .b-prop { background: #374151; color: #d1d5db; }
    .b-watch { background: #14532d; color: #bbf7d0; }
    .b-emergency { background: #dc2626; color: #fff; }
    .empty { padding: 24px 12px; text-align: center; color: #8b96ad; }
  </style>
</head>
<body>
  <header>
    <h1>WingPing</h1>
    <button id="mapBtn" title="Open map view">🗺 Map</button>
    <button id="radarBtn" title="Toggle radar scope">📡</button>
    <a href="#" id="atc" title="Listen to live air traffic control on LiveATC">📻 ATC</a>
    <button id="refresh">Refresh</button>
    <a href="#" id="options">Settings</a>
  </header>
  <div id="err" hidden></div>
  <div id="meta"></div>
  <div id="mapWrap">
    <div id="miniMap"></div>
    <button id="expandMap" title="Open full map tab">⛶ Full</button>
    <div id="mapHint">Click an aircraft for its flight path · layers &amp; trails in full view</div>
  </div>
  <div id="radarWrap">
    <canvas id="radar" width="340" height="340"></canvas>
    <div id="radarHint">All traffic in range, alert status or not · click a blip for its flight path</div>
  </div>
  <ul id="list"></ul>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
