<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WingPing Settings</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      max-width: 620px; margin: 32px auto; padding: 0 16px;
      font: 14px/1.5 system-ui, sans-serif;
    }
    h1 { font-size: 20px; }
    fieldset { border: 1px solid #8884; border-radius: 8px; margin: 16px 0; padding: 12px 16px; }
    legend { font-weight: 600; padding: 0 6px; }
    label { display: block; margin: 8px 0 2px; font-weight: 500; }
    label.inline { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; margin-right: 16px; }
    input[type=number], input[type=text], select, textarea {
      width: 100%; box-sizing: border-box; padding: 6px 8px;
      border: 1px solid #8886; border-radius: 6px; font: inherit;
    }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    textarea { height: 90px; font-family: ui-monospace, monospace; }
    .hint { color: #888; font-size: 12px; margin-top: 2px; }
    button { padding: 8px 18px; border: 0; border-radius: 6px; background: #1d4ed8; color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: #4b5563; }
    #status { margin-left: 12px; color: #16a34a; }
  </style>
</head>
<body>
  <h1>WingPing Settings</h1>

  <fieldset>
    <legend>Location</legend>
    <div class="row">
      <div><label>Latitude</label><input type="number" id="lat" step="any"></div>
      <div><label>Longitude</label><input type="number" id="lon" step="any"></div>
    </div>
    <p><button class="secondary" id="geo" type="button">Use my current location</button></p>
    <div class="row">
      <div>
        <label>Alert radius (NM)</label>
        <input type="number" id="radiusNm" min="1" max="250" step="1">
        <div class="hint">How close counts as "overhead". 5 NM ≈ 9 km.</div>
      </div>
      <div>
        <label>Poll every (seconds)</label>
        <input type="number" id="pollSeconds" min="30" step="5">
        <div class="hint">Chrome's minimum is 30 s.</div>
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Alert categories</legend>
    <label class="inline"><input type="checkbox" id="cat-military"> Military</label>
    <label class="inline"><input type="checkbox" id="cat-helicopter"> Helicopters</label>
    <label class="inline"><input type="checkbox" id="cat-jet"> Jets</label>
    <div class="hint">Jets are off by default — near a city this fires constantly.</div>
  </fieldset>

  <fieldset>
    <legend>Watchlist</legend>
    <label>Specific aircraft (one per line or comma-separated)</label>
    <textarea id="watchlist" placeholder="N90210&#10;AE01CE&#10;SAM46&#10;EC35"></textarea>
    <div class="hint">Each entry matches ICAO hex, registration/tail number, callsign, or ICAO type code.</div>
  </fieldset>

  <fieldset>
    <legend>Behavior</legend>
    <div class="row">
      <div>
        <label>Re-alert cooldown (minutes)</label>
        <input type="number" id="cooldownMinutes" min="1" step="1">
      </div>
      <div>
        <label>Data source</label>
        <select id="provider">
          <option value="airplanes.live">airplanes.live (fallback: adsb.lol)</option>
          <option value="adsb.lol">adsb.lol (fallback: airplanes.live)</option>
        </select>
      </div>
    </div>
    <label>Map for "View flight path"</label>
    <select id="mapProvider">
      <option value="adsbexchange">ADS-B Exchange globe</option>
      <option value="airplanes.live">airplanes.live globe</option>
      <option value="adsb.lol">adsb.lol</option>
    </select>
    <p>
      <label class="inline"><input type="checkbox" id="notify"> Desktop notifications</label>
      <label class="inline"><input type="checkbox" id="ignoreGround"> Ignore aircraft on the ground</label>
    </p>
  </fieldset>

  <p><button id="save">Save</button><span id="status"></span></p>
  <script type="module" src="options.js"></script>
</body>
</html>
