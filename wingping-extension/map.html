<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WingPing Map</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; font: 13px/1.4 system-ui, sans-serif; }
    #map { position: absolute; inset: 0; background: #0b1220; }

    /* top bar */
    #bar {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 1000; display: flex; align-items: center; gap: 10px;
      background: rgba(11,18,32,.92); color: #e5eaf3;
      border: 1px solid #2a3450; border-radius: 10px; padding: 6px 12px;
      backdrop-filter: blur(4px); box-shadow: 0 6px 24px rgba(0,0,0,.4);
    }
    #bar .title { font-weight: 700; font-size: 13px; }
    #bar button {
      background: #1d4ed8; color: #fff; border: 0; border-radius: 6px;
      padding: 4px 10px; cursor: pointer; font-size: 12px;
    }
    #bar button.toggled { background: #166534; }
    #bar .sel { color: #facc15; font-weight: 600; }
    #bar .age { color: #8b96ad; font-size: 11px; }

    /* radar overlay panel */
    #radarPanel {
      position: absolute; right: 12px; bottom: 24px; z-index: 1000; display: none;
      background: rgba(4,12,7,.92); border: 1px solid #1c4a2c; border-radius: 12px;
      padding: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.5);
    }
    #radarPanel.open { display: block; }
    #radarPanel canvas { display: block; cursor: crosshair; }

    /* aircraft divIcon markers */
    .ac-marker { filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
    .ac-marker svg { overflow: visible; }
    .ac-label {
      position: absolute; left: 32px; top: 8px; white-space: nowrap;
      font: 700 10px system-ui; color: #fff;
      text-shadow: 0 0 3px #000, 0 0 3px #000;
      pointer-events: none;
    }
    .ac-label .sub { font-weight: 500; color: #cbd5e1; display: block; }

    .leaflet-container { background: #0b1220; }
    .leaflet-control-layers { border-radius: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="bar">
    <span class="title">🛩 WingPing Map</span>
    <span class="sel" id="selInfo"></span>
    <span class="age" id="age"></span>
    <button id="radarBtn" title="Toggle radar scope">📡 Radar</button>
    <button id="homeBtn" title="Center on home">🏠</button>
  </div>
  <div id="radarPanel"><canvas id="radar" width="300" height="300"></canvas></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="map.js"></script>
</body>
</html>
